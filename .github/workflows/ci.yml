name: CI

on:
  push:
    branches:
      - mvp
      - next
      - 'feature/**'
  pull_request:
    branches:
      - mvp
      - next

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Run Tests (Vitest)
        run: yarn test

      - name: Build Application
        run: yarn build
